name: Nx affected CI

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: affected-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NX_BASE: ${{ github.event.pull_request.base.sha }}
  NX_HEAD: ${{ github.sha }}
  NX_DAEMON: 'false'
  NX_NO_CLOUD: 'true'

jobs:
  validate:
    name: ${{ matrix.target }} (affected)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [typecheck, lint, test, build]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Show affected projects
        run: npm run --silent affected:projects
      - name: Execute affected target
        run: npm run --silent ${{ matrix.target }}:affected
