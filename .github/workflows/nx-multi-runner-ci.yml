name: Nx Angular CI (Multi Runner)

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NX_CLOUD: 'false'
      NX_DAEMON: 'false'
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node and npm cache
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type Check (Nx affected)
        shell: bash
        run: |
          set -euo pipefail
          npx nx affected -t typecheck --base=origin/develop --head=HEAD --outputStyle=static
  lint:
    name: Lint
    needs: type-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NX_CLOUD: 'false'
      NX_DAEMON: 'false'
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node and npm cache
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint (Nx affected)
        shell: bash
        run: |
          set -euo pipefail
          npx nx affected -t lint --base=origin/develop --head=HEAD --outputStyle=static
  unit-tests:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NX_CLOUD: 'false'
      NX_DAEMON: 'false'
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node and npm cache
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit Tests (Nx affected)
        shell: bash
        run: |
          set -euo pipefail
          npx nx affected -t test --base=origin/develop --head=HEAD --outputStyle=static
  build:
    name: Angular Build
    needs: unit-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      NX_CLOUD: 'false'
      NX_DAEMON: 'false'
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node and npm cache
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Find latest successful application artifact for this PR
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pullNumber = context.payload.pull_request.number;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id: 'nx-multi-runner-ci.yml',
              event: 'pull_request',
              status: 'success',
              per_page: 100,
            });
            const candidates = runs
              .filter((run) =>
                run.id !== context.runId &&
                run.pull_requests?.some((pull) => pull.number === pullNumber)
              )
              .sort((a, b) => b.run_number - a.run_number);
            for (const run of candidates) {
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner,
                repo,
                run_id: run.id,
                per_page: 100,
              });
              const artifact = artifacts.find(
                (item) => item.name === 'nx-pages-app-builds' && !item.expired,
              );
              if (artifact) {
                core.setOutput('run-id', String(run.id));
                core.info(`Using validated app outputs from successful PR run ${run.run_number}.`);
                return;
              }
            }
            core.setOutput('run-id', '');
            core.info('No reusable successful PR build artifact found; missing app outputs will be built.');
      - name: Download previous validated application outputs
        if: steps.previous.outputs.run-id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: nx-pages-app-builds
          run-id: ${{ steps.previous.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: previous-app-builds
      - name: Build affected Pages applications and package complete site
        run: node tools/build-affected-pages.mjs
      - name: Upload validated application outputs for future runs
        uses: actions/upload-artifact@v4
        with:
          name: nx-pages-app-builds
          path: dist/nx-pages-app-builds
          if-no-files-found: error
          retention-days: 30
      - name: Upload staged build
        uses: actions/upload-artifact@v4
        with:
          name: angular-build-staging
          path: dist/angular-github-actions/browser
          if-no-files-found: error
          retention-days: 1

  publish-artifact:
    name: Publish Validated Artifact
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download staged build
        uses: actions/download-artifact@v4
        with:
          name: angular-build-staging
          path: validated-build
      - name: Publish validated PR artifact
        uses: actions/upload-artifact@v4
        with:
          name: angular-pr-build
          path: validated-build
          if-no-files-found: error
          retention-days: 30

  deploy-cit:
    name: Deploy CIT to GitHub Pages
    needs: publish-artifact
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write # Retain the complete site on the gh-pages state branch.
      actions: read # Download artifacts from a different workflow run.
      pages: write
      id-token: write
    # Scope concurrency to this run, so earlier runs cannot block this deployment.
    concurrency:
      group: github-pages-cit-${{ github.run_id }}
      cancel-in-progress: false
    # Required reviewers for CIT are configured in GitHub Settings > Environments.
    environment:
      name: CIT
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SELECTED_ENVIRONMENT: CIT
    steps:
      - name: Resolve saved Pages site
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            try {
              await github.rest.repos.getBranch({ ...repo, branch: 'gh-pages' });
              core.setOutput('state-ref', 'gh-pages');
              core.setOutput('has-state', 'true');
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('state-ref', context.payload.repository.default_branch);
              core.setOutput('has-state', 'false');
            }

      - name: Download validated artifact from this PR run
        uses: actions/download-artifact@v4
        with:
          name: angular-pr-build
          path: pr-build

      - name: Checkout saved Pages site
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.state-ref }}
          path: deployment-state

      - name: Initialize site state on first deployment
        if: steps.source.outputs.has-state == 'false'
        working-directory: deployment-state
        run: git switch --orphan gh-pages

      - name: Update selected folder and preserve the other environments
        env:
          SITE_ROOT: ${{ github.workspace }}/deployment-state
          ARTIFACT_ROOT: ${{ github.workspace }}/pr-build
          PUBLISH_ROOT: ${{ runner.temp }}/pages-site
        run: |
          python3 - <<'PYTHON'
          import os
          import shutil
          from pathlib import Path

          folders = {'CIT': 'cit', 'DEV': 'dev', 'SIT': 'sit', 'QA': 'qa', 'PRODUCTION': 'production', 'PROD': 'production'}
          folder = folders[os.environ['SELECTED_ENVIRONMENT']]
          site = Path(os.environ['SITE_ROOT'])
          artifact = Path(os.environ['ARTIFACT_ROOT'])
          publish = Path(os.environ['PUBLISH_ROOT'])
          if any(path.is_symlink() for path in artifact.rglob('*')):
              raise RuntimeError('Build artifact must not contain symbolic links')
          if '<base href="./">' not in (artifact / 'index.html').read_text():
              raise RuntimeError('PR artifact must be built with --base-href ./')
          target = site / folder
          if target.is_symlink():
              target.unlink()
          elif target.exists():
              shutil.rmtree(target)
          shutil.copytree(artifact, target)
          publish.mkdir(parents=True, exist_ok=True)
          for name in folders.values():
              existing = site / name
              if existing.is_symlink():
                  raise RuntimeError('Saved environment folders must not be symbolic links')
              if existing.is_dir():
                  if any(path.is_symlink() for path in existing.rglob('*')):
                      raise RuntimeError('Saved site must not contain symbolic links')
                  shutil.copytree(existing, publish / name)
          print(f'Selected Environment: {os.environ["SELECTED_ENVIRONMENT"]}')
          print(f'Deploying validated PR artifact to /{folder}/')
          PYTHON

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload complete Pages site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages-site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Save deployed folders for the next manual run
        working-directory: deployment-state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for folder in cit dev sit qa production; do
            if [[ -d "$folder" ]]; then
              git add -- "$folder"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Update Pages environment: $SELECTED_ENVIRONMENT"
            git push origin HEAD:gh-pages
          fi

      - name: Report deployed URL
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          folder="${SELECTED_ENVIRONMENT,,}"
          echo "Deployed URL: ${PAGE_URL%/}/$folder/"
          echo "Deployed URL: ${PAGE_URL%/}/$folder/" >> "$GITHUB_STEP_SUMMARY"

