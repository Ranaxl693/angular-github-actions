name: Nx GitHub-backed Remote Cache POC

on:
  push:
    branches: [feature/op-nx-github-cache-poc]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  populate-cache:
    name: "Runner A - populate remote cache"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NX_CLOUD: 'false'
      NX_DAEMON: 'false'
      NX_CACHE_DIRECTORY: ${{ github.workspace }}/.nx/cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Configure isolated loopback cache
        shell: bash
        run: |
          echo "NX_SELF_HOSTED_REMOTE_CACHE_SERVER=http://127.0.0.1:3000" >> "$GITHUB_ENV"
          token="$(node -e 'process.stdout.write(require("crypto").randomBytes(32).toString("hex"))')"
          echo "::add-mask::${token}"
          echo "NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN=${token}" >> "$GITHUB_ENV"
      - name: Start GitHub-backed cache sidecar
        uses: op-nx/github-cache/start-cache-server@6c198f0aaef17b0ce75cf28448efc38075d39b01
        id: cache-server
        background: true
        with:
          port: '3000'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify sidecar is ready
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            status="$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN}" "${NX_SELF_HOSTED_REMOTE_CACHE_SERVER}/v1/cache/deadbeef" || true)"
            if [[ "$status" == "404" || "$status" == "200" ]]; then exit 0; fi
            sleep 1
          done
          echo "Cache sidecar unavailable (last HTTP status: ${status})" >&2
          exit 1
      - name: Lint, typecheck, test, build (populate)
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          npx nx run-many -t lint typecheck test build --outputStyle=static 2>&1 | tee nx-cache-producer.log
          echo "Producer elapsed: $(( $(date +%s) - start )) seconds" >> "$GITHUB_STEP_SUMMARY"
          echo "Producer cache lines: $(grep -Eic 'read from cache|existing outputs match the cache|cache hit' nx-cache-producer.log || true)" >> "$GITHUB_STEP_SUMMARY"
      - cancel: cache-server

  reuse-cache:
    name: "Runner B - measure remote reuse"
    needs: populate-cache
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NX_CLOUD: 'false'
      NX_DAEMON: 'false'
      NX_CACHE_DIRECTORY: ${{ github.workspace }}/.nx/cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Configure isolated loopback cache
        shell: bash
        run: |
          echo "NX_SELF_HOSTED_REMOTE_CACHE_SERVER=http://127.0.0.1:3000" >> "$GITHUB_ENV"
          token="$(node -e 'process.stdout.write(require("crypto").randomBytes(32).toString("hex"))')"
          echo "::add-mask::${token}"
          echo "NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN=${token}" >> "$GITHUB_ENV"
      - name: Start GitHub-backed cache sidecar
        uses: op-nx/github-cache/start-cache-server@6c198f0aaef17b0ce75cf28448efc38075d39b01
        id: cache-server
        background: true
        with:
          port: '3000'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify sidecar is ready
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            status="$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN}" "${NX_SELF_HOSTED_REMOTE_CACHE_SERVER}/v1/cache/deadbeef" || true)"
            if [[ "$status" == "404" || "$status" == "200" ]]; then exit 0; fi
            sleep 1
          done
          echo "Cache sidecar unavailable (last HTTP status: ${status})" >&2
          exit 1
      - name: Lint, typecheck, test, build (reuse)
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          npx nx run-many -t lint typecheck test build --outputStyle=static 2>&1 | tee nx-cache-consumer.log
          echo "Consumer elapsed: $(( $(date +%s) - start )) seconds" >> "$GITHUB_STEP_SUMMARY"
          echo "Consumer cache lines: $(grep -Eic 'read from cache|existing outputs match the cache|cache hit' nx-cache-consumer.log || true)" >> "$GITHUB_STEP_SUMMARY"
          echo "Compare Runner A and Runner B job summaries and logs for cross-runner cache hits." >> "$GITHUB_STEP_SUMMARY"
      - cancel: cache-server
