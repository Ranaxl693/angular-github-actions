          folders = {'CIT': 'cit', 'DEV': 'dev', 'SIT': 'sit', 'QA': 'qa', 'PRODUCTION': 'production', 'PROD': 'production'}
          folder = folders[os.environ['SELECTED_ENVIRONMENT']]
          site = Path(os.environ['SITE_ROOT'])
          artifact = Path(os.environ['ARTIFACT_ROOT'])
          publish = Path(os.environ['PUBLISH_ROOT'])
          if any(path.is_symlink() for path in artifact.rglob('*')):
              raise RuntimeError('Build artifact must not contain symbolic links')
          if '<base href="./">' not in (artifact / 'index.html').read_text():
              raise RuntimeError('Pages artifact must be built with --base-href ./')
          target = site / folder
          if target.is_symlink():
              target.unlink()
          elif target.exists():
              shutil.rmtree(target)
          shutil.copytree(artifact, target)
          publish.mkdir(parents=True, exist_ok=True)
          for name in folders.values():
              existing = site / name
              if existing.is_symlink():
                  raise RuntimeError('Saved environment folders must not be symbolic links')
              if existing.is_dir():
                  if any(path.is_symlink() for path in existing.rglob('*')):
                      raise RuntimeError('Saved site must not contain symbolic links')
                  shutil.copytree(existing, publish / name)
          print(f'Selected Environment: {os.environ["SELECTED_ENVIRONMENT"]}')
          print(f'Deploying validated artifact to /{folder}/')
          PYTHON

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload complete Pages site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages-site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Save deployed folders for the next manual run
        working-directory: deployment-state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for folder in cit dev sit qa production; do
            if [[ -d "$folder" ]]; then
              git add -- "$folder"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Update Pages environment: $SELECTED_ENVIRONMENT"
            git push origin HEAD:gh-pages
          fi

      - name: Report deployed URL
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          folder="${SELECTED_ENVIRONMENT,,}"
          echo "Deployed URL: ${PAGE_URL%/}/$folder/"
          echo "Deployed URL: ${PAGE_URL%/}/$folder/" >> "$GITHUB_STEP_SUMMARY"
