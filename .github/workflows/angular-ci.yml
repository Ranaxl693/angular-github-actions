name: Angular CLI CI

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to build (no deployment)
        type: choice
        required: true
        default: CIT
        options:
          - CIT
          - DEV
          - PRODUCTION

permissions:
  contents: read

concurrency:
  group: angular-ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.environment || 'CIT' }}
  cancel-in-progress: true

jobs:
  validate:
    name: Type Check, Test and Build
    runs-on: ubuntu-latest
    env:
      # Pull requests have no manual input and always use CIT.
      SELECTED_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'CIT' }}
    steps:
      - name: Select environment
        shell: bash
        run: |
          case "$SELECTED_ENVIRONMENT" in
            CIT) BUILD_CONFIGURATION=cit ;;
            DEV) BUILD_CONFIGURATION=dev ;;
            PRODUCTION) BUILD_CONFIGURATION=production ;;
            *) echo "Unsupported environment: $SELECTED_ENVIRONMENT" >&2; exit 1 ;;
          esac
          echo "BUILD_CONFIGURATION=$BUILD_CONFIGURATION" >> "$GITHUB_ENV"
          echo "Selected Environment: $SELECTED_ENVIRONMENT"
          {
            echo "## Angular environment build"
            echo "Selected Environment: $SELECTED_ENVIRONMENT"
            echo ""
            echo "Angular configuration: $BUILD_CONFIGURATION"
            echo ""
            echo "Build validation only; no deployment."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node and npm cache
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Run unit tests
        run: npm test -- --watch=false

      - name: Angular build
        run: |
          echo "Running Angular Build for $SELECTED_ENVIRONMENT"
          npm run build -- --configuration "$BUILD_CONFIGURATION"
