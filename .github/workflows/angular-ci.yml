name: Nx Angular CI

on:
  push:
    branches: [feature/op-nx-github-cache-poc]
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options: [CIT, DEV, SIT, PROD]

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    name: Validate and Build (single runner)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    env:
      NX_CLOUD: 'false'
      NX_DAEMON: 'false'
      NX_CACHE_DIRECTORY: ${{ github.workspace }}/.nx/cache
    steps:
      - name: Checkout full history for Nx affected
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node and npm cache
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Nx GitHub remote cache
        shell: bash
        run: |
          echo "NX_SELF_HOSTED_REMOTE_CACHE_SERVER=http://127.0.0.1:3000" >> "$GITHUB_ENV"
          token="$(node -e 'process.stdout.write(require("crypto").randomBytes(32).toString("hex"))')"
          echo "::add-mask::${token}"
          echo "NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN=${token}" >> "$GITHUB_ENV"

      - name: Start GitHub-backed Nx cache sidecar
        uses: op-nx/github-cache/start-cache-server@6c198f0aaef17b0ce75cf28448efc38075d39b01
        id: cache-server
        background: true
        with:
          port: '3000'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for Nx remote cache
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            status="$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN}" "${NX_SELF_HOSTED_REMOTE_CACHE_SERVER}/v1/cache/deadbeef" || true)"
            if [[ "$status" == "404" || "$status" == "200" ]]; then exit 0; fi
            sleep 1
          done
          echo "Nx cache sidecar did not become ready (HTTP ${status})" >&2
          exit 1

      - name: Show CI commands and execution scope
        shell: bash
        run: |
          {
            echo '### Commands executed by CI'
            echo ''
            echo '| Step | Command | Purpose |'
            echo '| --- | --- | --- |'
            echo '| Install dependencies | `npm ci` | Install locked dependencies |'
            echo '| Type Check | `npx nx affected -t typecheck --base=origin/develop --head=HEAD --outputStyle=static` | Validate affected TypeScript projects |'
            echo '| Lint | `npx nx affected -t lint --base=origin/develop --head=HEAD --outputStyle=static` | Lint affected projects |'
            echo '| Unit Tests | `npx nx affected -t test --base=origin/develop --head=HEAD --outputStyle=static` | Test affected projects |'
            echo '| Affected scope | `npx nx show projects --affected --base=origin/develop --head=HEAD --json` | Report affected projects |'
            echo '| Affected Build | `npx nx affected -t build --base=origin/develop --head=HEAD --outputStyle=static` | Build affected projects |'
            echo '| Complete Pages package | Manual deployment only | Build all apps outside PR validation |'
            echo '| Browser installation | Manual deployment only | Install E2E browser |'
            echo '| Browser E2E | Manual deployment only | Test complete federated app |'
            echo ''
            echo '> This table reflects the configured CI commands. Nx determines the projects and dependent tasks actually executed.'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Validate affected type check targets
        shell: bash
        run: |
          set -euo pipefail
          npx nx affected -t typecheck --base=origin/develop --head=HEAD --outputStyle=static

      - name: Validate affected lint targets
        shell: bash
        run: |
          set -euo pipefail
          npx nx affected -t lint --base=origin/develop --head=HEAD --outputStyle=static

      - name: Validate affected unit tests targets
        shell: bash
        run: |
          set -euo pipefail
          npx nx affected -t test --base=origin/develop --head=HEAD --outputStyle=static

      - name: Report Nx affected scope and savings
        shell: bash
        run: |
          set -euo pipefail
          npx nx show projects --json > nx-all-projects.json
          npx nx show projects --affected --base=origin/develop --head=HEAD --json > nx-affected-projects.json
          python3 - <<'PY'
          import json, os
          all_projects = set(json.load(open("nx-all-projects.json")))
          affected = set(json.load(open("nx-affected-projects.json")))
          skipped = sorted(all_projects - affected)
          summary = os.environ["GITHUB_STEP_SUMMARY"]
          with open(summary, "a") as out:
              out.write("### Nx affected scope (actual PR vs develop)\n")
              out.write(f"- Workspace projects: **{len(all_projects)}**\n")
              out.write(f"- Affected projects: **{len(affected)}** — {', '.join(sorted(affected)) or 'none'}\n")
              out.write(f"- Unaffected projects: **{len(skipped)}** — {', '.join(skipped) or 'none'}\n")
              out.write(f"- Projects excluded from affected selection: **{len(skipped)}/{len(all_projects)}**\n")
              out.write("- These counts show affected selection, **not** cache hits or total builds skipped.\n")
              out.write("- Full Pages packaging runs only in the manual deployment workflow.\n")
          PY

      - name: Validate affected build targets
        id: nx-run
        shell: bash
        run: |
          set -o pipefail
          start=$(date +%s)
          npx nx affected -t build --base=origin/develop --head=HEAD --outputStyle=static 2>&1 | tee nx-build.log
          echo "duration=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"

      - cancel: cache-server

      - name: Nx cache and execution summary
        if: always()
        shell: bash
        env:
          DURATION: ${{ steps.nx-run.outputs.duration }}
        run: |
          {
            echo "### Nx Angular Build"
            echo "- npm dependency downloads cached by setup-node; Nx task cache uses GitHub-backed remote caching."
            echo "- Nx affected execution: ${DURATION:-not completed} seconds"
            if [[ -f nx-build.log ]]; then
              echo "- Nx cache-replay lines (indicative): $(grep -Eic 'read from cache|existing outputs match the cache|cache hit' nx-build.log || true)"
            fi
            echo "- Nx cache directory: $(du -sh .nx/cache 2>/dev/null | cut -f1 || echo 'not created')"
          } >> "$GITHUB_STEP_SUMMARY"

  package-for-deployment:
    name: Build and E2E Test Complete Pages Site
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    env:
      NX_CLOUD: 'false'
      NX_DAEMON: 'false'
    steps:
      - name: Checkout deployment revision
        uses: actions/checkout@v4

      - name: Setup Node and npm cache
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Nx GitHub remote cache
        shell: bash
        run: |
          echo "NX_SELF_HOSTED_REMOTE_CACHE_SERVER=http://127.0.0.1:3000" >> "$GITHUB_ENV"
          token="$(node -e 'process.stdout.write(require("crypto").randomBytes(32).toString("hex"))')"
          echo "::add-mask::${token}"
          echo "NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN=${token}" >> "$GITHUB_ENV"

      - name: Start GitHub-backed Nx cache sidecar
        uses: op-nx/github-cache/start-cache-server@6c198f0aaef17b0ce75cf28448efc38075d39b01
        id: cache-server
        background: true
        with:
          port: '3000'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for Nx remote cache
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            status="$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN}" "${NX_SELF_HOSTED_REMOTE_CACHE_SERVER}/v1/cache/deadbeef" || true)"
            if [[ "$status" == "404" || "$status" == "200" ]]; then exit 0; fi
            sleep 1
          done
          echo "Nx cache sidecar did not become ready (HTTP ${status})" >&2
          exit 1

      - name: Package complete Pages build
        run: npm run build:pages

      - name: Install browser for federation checks
        run: npm exec -- playwright install --with-deps chromium

      - name: Verify federated application in a browser
        run: npm run e2e

      - name: Upload validated Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: angular-pr-build
          path: dist/angular-github-actions/browser
          if-no-files-found: error
          retention-days: 30

      - cancel: cache-server

  deploy-cit:
    name: Deploy CIT to GitHub Pages
    needs: package-for-deployment
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'CIT'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Retain the complete site on the gh-pages state branch.
      actions: read # Download artifacts from a different workflow run.
      pages: write
      id-token: write
    # All folders share one Pages site; never overlap or interrupt deployments.
    concurrency:
      group: github-pages-cit-${{ github.run_id }}
      cancel-in-progress: false
    # Required reviewers for CIT are configured in GitHub Settings > Environments.
    environment:
      name: CIT
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SELECTED_ENVIRONMENT: CIT
    steps:
      - name: Resolve saved Pages site
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            try {
              await github.rest.repos.getBranch({ ...repo, branch: 'gh-pages' });
              core.setOutput('state-ref', 'gh-pages');
              core.setOutput('has-state', 'true');
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('state-ref', context.payload.repository.default_branch);
              core.setOutput('has-state', 'false');
            }

      - name: Download validated artifact from this deployment run
        uses: actions/download-artifact@v4
        with:
          name: angular-pr-build
          path: pr-build

      - name: Checkout saved Pages site
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.state-ref }}
          path: deployment-state

      - name: Initialize site state on first deployment
        if: steps.source.outputs.has-state == 'false'
        working-directory: deployment-state
        run: git switch --orphan gh-pages

      - name: Update selected folder and preserve the other environments
        env:
          SITE_ROOT: ${{ github.workspace }}/deployment-state
          ARTIFACT_ROOT: ${{ github.workspace }}/pr-build
          PUBLISH_ROOT: ${{ runner.temp }}/pages-site
        run: |
          python3 - <<'PYTHON'
          import os
          import shutil
          from pathlib import Path

          folders = {'CIT': 'cit', 'DEV': 'dev', 'SIT': 'sit', 'QA': 'qa', 'PRODUCTION': 'production', 'PROD': 'production'}
          folder = folders[os.environ['SELECTED_ENVIRONMENT']]
          site = Path(os.environ['SITE_ROOT'])
          artifact = Path(os.environ['ARTIFACT_ROOT'])
          publish = Path(os.environ['PUBLISH_ROOT'])
          if any(path.is_symlink() for path in artifact.rglob('*')):
              raise RuntimeError('Build artifact must not contain symbolic links')
          if '<base href="./">' not in (artifact / 'index.html').read_text():
              raise RuntimeError('Pages artifact must be built with --base-href ./')
          target = site / folder
          if target.is_symlink():
              target.unlink()
          elif target.exists():
              shutil.rmtree(target)
          shutil.copytree(artifact, target)
          publish.mkdir(parents=True, exist_ok=True)
          for name in folders.values():
              existing = site / name
              if existing.is_symlink():
                  raise RuntimeError('Saved environment folders must not be symbolic links')
              if existing.is_dir():
                  if any(path.is_symlink() for path in existing.rglob('*')):
                      raise RuntimeError('Saved site must not contain symbolic links')
                  shutil.copytree(existing, publish / name)
          print(f'Selected Environment: {os.environ["SELECTED_ENVIRONMENT"]}')
          print(f'Deploying validated artifact to /{folder}/')
          PYTHON

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload complete Pages site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages-site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Save deployed folders for the next manual run
        working-directory: deployment-state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for folder in cit dev sit qa production; do
            if [[ -d "$folder" ]]; then
              git add -- "$folder"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Update Pages environment: $SELECTED_ENVIRONMENT"
            git push origin HEAD:gh-pages
          fi

      - name: Report deployed URL
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          folder="${SELECTED_ENVIRONMENT,,}"
          echo "Deployed URL: ${PAGE_URL%/}/$folder/"
          echo "Deployed URL: ${PAGE_URL%/}/$folder/" >> "$GITHUB_STEP_SUMMARY"

