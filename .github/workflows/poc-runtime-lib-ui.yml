name: Runtime UI POC (no deployment)
on:
  push:
    branches: ['poc/runtime-lib-ui-independent-release']
  workflow_dispatch:
permissions:
  contents: read
env:
  NX_NO_CLOUD: 'true'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tools/poc-runtime-lib-ui.mjs
